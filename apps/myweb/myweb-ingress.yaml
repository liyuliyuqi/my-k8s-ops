apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myweb
  namespace: magedu
spec:
  ingressClassName: nginx
  rules:
  - host: myweb.magedu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myweb
            port:
              number: 80
