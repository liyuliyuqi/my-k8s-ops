apiVersion: apps/v1
kind: Deployment
metadata:
  name: myweb
  namespace: magedu
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: myweb
  template:
    metadata:
      labels:
        app: myweb
    spec:
      containers:
      - name: web
        image: crpi-j1pca6z0vs1b8pmx.cn-heyuan.personal.cr.aliyuncs.com/liyuqidesu/myweb:v0-notpushed-yet
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
