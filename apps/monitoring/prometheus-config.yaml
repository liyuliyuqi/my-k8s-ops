apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets: ["localhost:9090"]
    - job_name: node
      static_configs:
      - targets:
        - 172.30.211.117:9100
        - 172.30.211.114:9100
        - 172.30.211.115:9100
    - job_name: mysqld
      static_configs:
      - targets: ["mysqld-exporter:9104"]
