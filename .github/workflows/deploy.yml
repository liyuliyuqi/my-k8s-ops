name: deploy-myweb
on:
  push:
    branches: [main]
    paths:
      - 'apps/myweb/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        run: echo "${{ secrets.ACR_REGISTRY_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u "${{ secrets.ACR_REGISTRY_USER }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/myweb:${{ github.sha }}
          docker build -t "$IMAGE" apps/myweb
          docker push "$IMAGE"

  deploy:
    runs-on: self-hosted
    needs: build-push
    steps:
      - name: Rolling update
        run: kubectl -n magedu set image deployment/myweb web=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/myweb:${{ github.sha }}
